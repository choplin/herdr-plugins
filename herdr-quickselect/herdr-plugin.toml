id = "choplin.quickselect"
name = "Quick Select"
version = "0.3.0"
min_herdr_version = "0.8.2"
description = "Select visible pane text and run configurable actions"
platforms = ["linux", "macos"]

[[build]]
command = ["go", "build", "-trimpath", "-o", "herdr-quickselect", "./cmd/herdr-quickselect"]

[[actions]]
id = "copy"
title = "Copy visible item"
contexts = ["pane", "workspace"]
command = ["./herdr-quickselect", "launch", "copy"]

[[actions]]
id = "open-url"
title = "Open visible URL"
contexts = ["pane", "workspace"]
command = ["./herdr-quickselect", "launch", "open-url"]
